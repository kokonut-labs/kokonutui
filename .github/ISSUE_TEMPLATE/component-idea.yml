name: Component idea
description: Suggest a component for the catalog.
labels: ["enhancement"]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Where it's used
      description: The screen or flow in a real app this component belongs to.
    validations:
      required: true
  - type: textarea
    id: interaction
    attributes:
      label: How it should feel
      description: The interaction that makes it worth a component. Links to references help.
    validations:
      required: true
